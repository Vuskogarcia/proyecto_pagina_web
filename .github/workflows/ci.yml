# Pipeline de CI con quality gates de seguridad (guía Módulo 7, semana 13, §7):
#
#   Push/PR → Build → Pruebas (unitarias + seguridad, contra PostgreSQL real)
#           → Cobertura mínima → Análisis estático (bandit)
#           → Dependencias vulnerables (pip-audit) → Secretos expuestos (gitleaks)
#
# Si cualquier paso falla, el PR no debe fusionarse (quality gate).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y cobertura (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: tests

    env:
      DB_ENGINE: postgres
      DB_HOST: localhost
      # Contraseña del Postgres de servicio de este job (no es un secreto real).
      DB_PASSWORD: adminpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # settings.py ya no trae SECRET_KEY de respaldo (ADL-07): se genera una
      # aleatoria por ejecución, que nunca queda escrita en el repositorio.
      - name: Generar SECRET_KEY de la ejecución
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Verificar que no faltan migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas unitarias, de integración y de seguridad
        run: coverage run manage.py test -v 2

      - name: "Quality gate: cobertura mínima 85 %"
        run: coverage report --fail-under=85

      # Revisión de configuración de producción de Django (con HTTPS activo).
      # Falla si aparece un error; W021 (HSTS preload) es una decisión consciente.
      - name: Revisar configuración de despliegue
        run: HTTPS=true python manage.py check --deploy --fail-level ERROR

  seguridad:
    name: Análisis estático, dependencias y secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks revisa todo el historial

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Instalar herramientas
        run: pip install -r tests/requirements-dev.txt

      # SAST: falla con hallazgos de severidad media o alta. Los de severidad
      # baja (claves de datos de prueba en comun/fabricas.py) quedan en el reporte.
      - name: "Quality gate: análisis estático (bandit)"
        run: bandit -r tests -x tests/venv,tests/.venv,tests/staticfiles --severity-level medium

      - name: "Quality gate: dependencias sin vulnerabilidades conocidas (pip-audit)"
        run: pip-audit -r tests/requirements.txt

      - name: "Quality gate: sin secretos expuestos (gitleaks)"
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose
